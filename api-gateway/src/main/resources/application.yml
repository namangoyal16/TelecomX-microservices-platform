server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        # NOTE: order matters here. "/api/v1/customers/*/invoices/**" is more
        # specific than customer-service's "/api/v1/customers/**" and MUST be
        # listed first, or every invoice request would incorrectly match the
        # broader customer-service route instead.
        - id: billing-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/customers/*/invoices/**

        - id: customer-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/plans/**,/api/v1/customers/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        - id: provisioning-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/provisioning/**

        - id: usage-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/usage/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**

      # CORS so the React admin dashboard (served separately) can call the gateway.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"

jwt:
  secret: "dGVsZWNvbXgtcGxhdGZvcm0tc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZC0zMg=="

# Paths that do NOT require a JWT at the gateway (still individually protected
# or intentionally public further downstream, e.g. plan catalog browsing).
security:
  public-paths:
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/plans
    - /actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
      cors:
        allowed-origins: "*"
        allowed-methods: GET
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: redis
  cloud:
    gateway:
      routes:
        - id: billing-service
          uri: http://billing-service:8084
          predicates:
            - Path=/api/v1/customers/*/invoices/**
        - id: customer-service
          uri: http://customer-service:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/plans/**,/api/v1/customers/**
        - id: provisioning-service
          uri: http://provisioning-service:8082
          predicates:
            - Path=/api/v1/provisioning/**
        - id: usage-service
          uri: http://usage-service:8083
          predicates:
            - Path=/api/v1/usage/**
        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**
management:
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT}
