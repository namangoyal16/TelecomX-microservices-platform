apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: telecomx
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/telecomx-api-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: telecomx-shared-config }
          env:
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: JWT_SECRET } } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 25
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "320Mi" }
            limits: { cpu: "500m", memory: "480Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: telecomx }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
