apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: telecomx
spec:
  replicas: 2
  selector: { matchLabels: { app: billing-service } }
  template:
    metadata: { labels: { app: billing-service } }
    spec:
      containers:
        - name: billing-service
          image: ghcr.io/your-org/telecomx-billing-service:latest
          ports: [{ containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: telecomx-shared-config }
          env:
            - { name: SPRING_DATASOURCE_URL, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: BILLING_DB_URL } } }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: POSTGRES_USER } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: POSTGRES_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: JWT_SECRET } } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "600m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: billing-service, namespace: telecomx }
spec:
  selector: { app: billing-service }
  ports: [{ port: 8084, targetPort: 8084 }]
