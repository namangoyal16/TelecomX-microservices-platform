apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usage-service-hpa
  namespace: telecomx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usage-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30   # react fast to a sudden spike in call volume
    scaleDown:
      stabilizationWindowSeconds: 300  # but don't thrash pods down on a brief lull
