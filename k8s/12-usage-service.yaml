# Usage/CDR Ingestion Service is the platform's most volatile-load component
# (peak calling hours = traffic spikes), which is exactly why it gets an HPA
# (see 12b-usage-service-hpa.yaml) while the other services run fixed replica
# counts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-service
  namespace: telecomx
spec:
  replicas: 2
  selector: { matchLabels: { app: usage-service } }
  template:
    metadata: { labels: { app: usage-service } }
    spec:
      containers:
        - name: usage-service
          image: ghcr.io/your-org/telecomx-usage-service:latest
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: telecomx-shared-config }
          env:
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: JWT_SECRET } } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: usage-service, namespace: telecomx }
spec:
  selector: { app: usage-service }
  ports: [{ port: 8083, targetPort: 8083 }]
