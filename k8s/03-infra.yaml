# ---------------------------------------------------------------------------
# Infra components as plain Deployments for demo/dev clusters (e.g. minikube,
# kind). In a real production cluster these would be managed services
# (RDS/CloudSQL for Postgres, Atlas for MongoDB, ElastiCache/MemoryStore for
# Redis, MSK/Confluent Cloud for Kafka) or run via proper StatefulSets/Operators
# with persistent volumes and backups - not raw Deployments like this.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: telecomx
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: telecomx-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: telecomx-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "customerdb,provisioningdb,billingdb"
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: telecomx }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: telecomx
spec:
  replicas: 1
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports: [{ containerPort: 27017 }]
---
apiVersion: v1
kind: Service
metadata: { name: mongodb, namespace: telecomx }
spec:
  selector: { app: mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: telecomx
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: telecomx }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: telecomx
spec:
  replicas: 1
  selector: { matchLabels: { app: zookeeper } }
  template:
    metadata: { labels: { app: zookeeper } }
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          ports: [{ containerPort: 2181 }]
          env:
            - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME, value: "2000" }
---
apiVersion: v1
kind: Service
metadata: { name: zookeeper, namespace: telecomx }
spec:
  selector: { app: zookeeper }
  ports: [{ port: 2181, targetPort: 2181 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: telecomx
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_BROKER_ID, value: "1" }
            - { name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper.telecomx.svc.cluster.local:2181" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.telecomx.svc.cluster.local:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: telecomx }
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: telecomx
spec:
  replicas: 1
  selector: { matchLabels: { app: zipkin } }
  template:
    metadata: { labels: { app: zipkin } }
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          ports: [{ containerPort: 9411 }]
---
apiVersion: v1
kind: Service
metadata: { name: zipkin, namespace: telecomx }
spec:
  selector: { app: zipkin }
  ports: [{ port: 9411, targetPort: 9411 }]
