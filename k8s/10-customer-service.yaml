apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: telecomx
spec:
  replicas: 2
  selector: { matchLabels: { app: customer-service } }
  template:
    metadata: { labels: { app: customer-service } }
    spec:
      containers:
        - name: customer-service
          image: ghcr.io/your-org/telecomx-customer-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: telecomx-shared-config }
          env:
            - { name: SPRING_DATASOURCE_URL, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: CUSTOMER_DB_URL } } }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: POSTGRES_USER } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: POSTGRES_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: telecomx-secrets, key: JWT_SECRET } } }
          # Readiness distinguishes "JVM started" from "DB/Kafka actually reachable" -
          # a pod that's up but can't reach Postgres should not receive traffic.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: customer-service, namespace: telecomx }
spec:
  selector: { app: customer-service }
  ports: [{ port: 8081, targetPort: 8081 }]
