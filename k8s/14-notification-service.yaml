apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: telecomx
spec:
  replicas: 2
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/your-org/telecomx-notification-service:latest
          ports: [{ containerPort: 8085 }]
          envFrom:
            - configMapRef: { name: telecomx-shared-config }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            initialDelaySeconds: 25
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "300m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: telecomx }
spec:
  selector: { app: notification-service }
  ports: [{ port: 8085, targetPort: 8085 }]
