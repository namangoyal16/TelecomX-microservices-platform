<svg viewBox="0 0 1300 860" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B8DEF"/>
    </marker>
    <marker id="arrowKafka" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F5A623"/>
    </marker>
  </defs>

  <rect width="1300" height="860" fill="#0A0E17"/>
  <text x="30" y="40" fill="#E4E9F2" font-size="22" font-weight="700">TelecomX — Service Provisioning &amp; Billing Platform</text>
  <text x="30" y="62" fill="#6B7A99" font-size="13">Architecture overview — synchronous calls in blue, Kafka async events in amber</text>

  <!-- Client / Dashboard -->
  <rect x="30" y="100" width="180" height="60" rx="4" fill="#10182B" stroke="#5B8DEF" stroke-width="2"/>
  <text x="120" y="126" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">React Admin</text>
  <text x="120" y="144" fill="#6B7A99" font-size="11" text-anchor="middle">Dashboard (NOC theme)</text>

  <!-- API Gateway -->
  <rect x="30" y="200" width="180" height="60" rx="4" fill="#10182B" stroke="#5B8DEF" stroke-width="2"/>
  <text x="120" y="226" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">API Gateway</text>
  <text x="120" y="244" fill="#6B7A99" font-size="11" text-anchor="middle">JWT edge check · rate limit</text>
  <line x1="120" y1="160" x2="120" y2="200" stroke="#5B8DEF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 microservices row -->
  <g id="svc-customer">
    <rect x="30" y="320" width="190" height="72" rx="4" fill="#10182B" stroke="#3DDC84" stroke-width="2"/>
    <text x="125" y="345" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Customer &amp;</text>
    <text x="125" y="361" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Subscription Svc</text>
    <text x="125" y="379" fill="#6B7A99" font-size="10.5" text-anchor="middle">PostgreSQL · JWT issuer</text>
  </g>

  <g id="svc-provisioning">
    <rect x="260" y="320" width="190" height="72" rx="4" fill="#10182B" stroke="#3DDC84" stroke-width="2"/>
    <text x="355" y="345" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Provisioning</text>
    <text x="355" y="361" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Service</text>
    <text x="355" y="379" fill="#6B7A99" font-size="10.5" text-anchor="middle">PostgreSQL + Redis</text>
  </g>

  <g id="svc-usage">
    <rect x="490" y="320" width="190" height="72" rx="4" fill="#10182B" stroke="#3DDC84" stroke-width="2"/>
    <text x="585" y="345" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Usage / CDR</text>
    <text x="585" y="361" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Ingestion Service</text>
    <text x="585" y="379" fill="#6B7A99" font-size="10.5" text-anchor="middle">MongoDB · HPA-scaled</text>
  </g>

  <g id="svc-billing">
    <rect x="720" y="320" width="190" height="72" rx="4" fill="#10182B" stroke="#3DDC84" stroke-width="2"/>
    <text x="815" y="345" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Billing &amp;</text>
    <text x="815" y="361" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Invoicing Service</text>
    <text x="815" y="379" fill="#6B7A99" font-size="10.5" text-anchor="middle">PostgreSQL · idempotent pay</text>
  </g>

  <g id="svc-notification">
    <rect x="950" y="320" width="190" height="72" rx="4" fill="#10182B" stroke="#3DDC84" stroke-width="2"/>
    <text x="1045" y="345" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Notification</text>
    <text x="1045" y="361" fill="#E4E9F2" font-size="13" text-anchor="middle" font-weight="600">Service</text>
    <text x="1045" y="379" fill="#6B7A99" font-size="10.5" text-anchor="middle">Stateless Kafka consumer</text>
  </g>

  <!-- Gateway -> services (sync) -->
  <line x1="120" y1="260" x2="125" y2="320" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="260" x2="355" y2="320" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="260" x2="585" y2="320" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="205" y1="260" x2="815" y2="320" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="209" y1="260" x2="1045" y2="320" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kafka bus -->
  <rect x="30" y="460" width="1110" height="70" rx="4" fill="#131B2E" stroke="#F5A623" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="585" y="485" fill="#F5A623" font-size="13" text-anchor="middle" font-weight="700">Kafka Event Bus</text>
  <text x="585" y="503" fill="#E4E9F2" font-size="10.5" text-anchor="middle">
    subscription.requested · subscriber.provisioned · usage.recorded · invoice.generated · payment.failed  (+ .DLT dead-letter topics per topic)
  </text>

  <!-- service -> kafka (produce/consume) -->
  <line x1="125" y1="392" x2="125" y2="460" stroke="#F5A623" stroke-width="1.5" marker-end="url(#arrowKafka)"/>
  <line x1="355" y1="392" x2="355" y2="460" stroke="#F5A623" stroke-width="1.5"/>
  <line x1="355" y1="460" x2="355" y2="392" stroke="#F5A623" stroke-width="1.5" marker-end="url(#arrowKafka)"/>
  <line x1="585" y1="392" x2="585" y2="460" stroke="#F5A623" stroke-width="1.5" marker-end="url(#arrowKafka)"/>
  <line x1="815" y1="460" x2="815" y2="392" stroke="#F5A623" stroke-width="1.5" marker-end="url(#arrowKafka)"/>
  <line x1="1045" y1="460" x2="1045" y2="392" stroke="#F5A623" stroke-width="1.5" marker-end="url(#arrowKafka)"/>

  <!-- Data stores row -->
  <rect x="30" y="580" width="190" height="56" rx="4" fill="#10182B" stroke="#1D2A44" stroke-width="1.5"/>
  <text x="125" y="605" fill="#E4E9F2" font-size="12" text-anchor="middle" font-weight="600">PostgreSQL</text>
  <text x="125" y="622" fill="#6B7A99" font-size="10" text-anchor="middle">customerdb · provisioningdb · billingdb</text>

  <rect x="260" y="580" width="190" height="56" rx="4" fill="#10182B" stroke="#1D2A44" stroke-width="1.5"/>
  <text x="355" y="605" fill="#E4E9F2" font-size="12" text-anchor="middle" font-weight="600">Redis</text>
  <text x="355" y="622" fill="#6B7A99" font-size="10" text-anchor="middle">active-subscriber cache</text>

  <rect x="490" y="580" width="190" height="56" rx="4" fill="#10182B" stroke="#1D2A44" stroke-width="1.5"/>
  <text x="585" y="605" fill="#E4E9F2" font-size="12" text-anchor="middle" font-weight="600">MongoDB</text>
  <text x="585" y="622" fill="#6B7A99" font-size="10" text-anchor="middle">usage_events collection</text>

  <line x1="125" y1="392" x2="125" y2="580" stroke="#1D2A44" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="355" y1="392" x2="355" y2="580" stroke="#1D2A44" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="355" y1="392" x2="230" y2="605" stroke="#1D2A44" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="585" y1="392" x2="585" y2="580" stroke="#1D2A44" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="815" y1="392" x2="150" y2="605" stroke="#1D2A44" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Observability -->
  <rect x="720" y="580" width="420" height="56" rx="4" fill="#10182B" stroke="#1D2A44" stroke-width="1.5"/>
  <text x="930" y="605" fill="#E4E9F2" font-size="12" text-anchor="middle" font-weight="600">Zipkin (distributed tracing)</text>
  <text x="930" y="622" fill="#6B7A99" font-size="10" text-anchor="middle">every service exports spans via Micrometer/OpenTelemetry</text>

  <!-- Legend / notes box -->
  <rect x="30" y="680" width="1110" height="150" rx="4" fill="#10182B" stroke="#1D2A44" stroke-width="1.5"/>
  <text x="50" y="708" fill="#E4E9F2" font-size="13" font-weight="700">Why this shape</text>
  <text x="50" y="730" fill="#9AA7C2" font-size="11.5">• Gateway → services is synchronous (client is waiting for a response: login, browse plans, check status).</text>
  <text x="50" y="750" fill="#9AA7C2" font-size="11.5">• Service → Kafka → service is asynchronous (provisioning, billing, notification — none of these should block the caller or each other).</text>
  <text x="50" y="770" fill="#9AA7C2" font-size="11.5">• Each service owns its own database — no service reaches into another service's tables directly (database-per-service).</text>
  <text x="50" y="790" fill="#9AA7C2" font-size="11.5">• Usage/CDR Service gets a Kubernetes HPA because it absorbs the platform's most volatile load (peak calling hours).</text>
  <text x="50" y="810" fill="#9AA7C2" font-size="11.5">• Every Kafka consumer has a matching .DLT topic — failed messages are retried with backoff, then parked for manual replay, never silently dropped.</text>
</svg>
