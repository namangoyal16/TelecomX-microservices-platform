<svg viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="1300" height="620" fill="#0A0E17"/>
  <text x="30" y="34" fill="#E4E9F2" font-size="19" font-weight="700">End-to-end flow: subscribe → provision → bill → notify</text>
  <text x="30" y="54" fill="#6B7A99" font-size="12">Solid arrows = synchronous HTTP. Dashed amber arrows = async Kafka event.</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5B8DEF"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F5A623"/></marker>
  </defs>

  <!-- Lifelines -->
  <!-- Customer -->
  <g>
    <rect x="20" y="80" width="140" height="36" rx="4" fill="#10182B" stroke="#5B8DEF"/>
    <text x="90" y="103" fill="#E4E9F2" font-size="12" text-anchor="middle">Customer (App)</text>
    <line x1="90" y1="116" x2="90" y2="580" stroke="#1D2A44" stroke-width="1.5"/>
  </g>
  <!-- Customer Service -->
  <g>
    <rect x="210" y="80" width="150" height="36" rx="4" fill="#10182B" stroke="#3DDC84"/>
    <text x="285" y="103" fill="#E4E9F2" font-size="12" text-anchor="middle">Customer Svc</text>
    <line x1="285" y1="116" x2="285" y2="580" stroke="#1D2A44" stroke-width="1.5"/>
  </g>
  <!-- Kafka -->
  <g>
    <rect x="410" y="80" width="120" height="36" rx="4" fill="#131B2E" stroke="#F5A623"/>
    <text x="470" y="103" fill="#F5A623" font-size="12" text-anchor="middle">Kafka</text>
    <line x1="470" y1="116" x2="470" y2="580" stroke="#1D2A44" stroke-width="1.5"/>
  </g>
  <!-- Provisioning -->
  <g>
    <rect x="580" y="80" width="150" height="36" rx="4" fill="#10182B" stroke="#3DDC84"/>
    <text x="655" y="103" fill="#E4E9F2" font-size="12" text-anchor="middle">Provisioning Svc</text>
    <line x1="655" y1="116" x2="655" y2="580" stroke="#1D2A44" stroke-width="1.5"/>
  </g>
  <!-- Usage -->
  <g>
    <rect x="780" y="80" width="130" height="36" rx="4" fill="#10182B" stroke="#3DDC84"/>
    <text x="845" y="103" fill="#E4E9F2" font-size="12" text-anchor="middle">Usage/CDR Svc</text>
    <line x1="845" y1="116" x2="845" y2="580" stroke="#1D2A44" stroke-width="1.5"/>
  </g>
  <!-- Billing -->
  <g>
    <rect x="960" y="80" width="130" height="36" rx="4" fill="#10182B" stroke="#3DDC84"/>
    <text x="1025" y="103" fill="#E4E9F2" font-size="12" text-anchor="middle">Billing Svc</text>
    <line x1="1025" y1="116" x2="1025" y2="580" stroke="#1D2A44" stroke-width="1.5"/>
  </g>
  <!-- Notification -->
  <g>
    <rect x="1140" y="80" width="140" height="36" rx="4" fill="#10182B" stroke="#3DDC84"/>
    <text x="1210" y="103" fill="#E4E9F2" font-size="12" text-anchor="middle">Notification Svc</text>
    <line x1="1210" y1="116" x2="1210" y2="580" stroke="#1D2A44" stroke-width="1.5"/>
  </g>

  <!-- Steps -->
  <line x1="90" y1="150" x2="285" y2="150" stroke="#5B8DEF" marker-end="url(#a1)"/>
  <text x="95" y="144" fill="#9AA7C2" font-size="11">1. POST /subscriptions {planCode}</text>

  <line x1="285" y1="190" x2="470" y2="190" stroke="#F5A623" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <text x="290" y="184" fill="#9AA7C2" font-size="11">2. publish subscription.requested</text>

  <line x1="90" y1="220" x2="285" y2="220" stroke="#5B8DEF" marker-end="url(#a1)" transform="rotate(180 187.5 220)"/>
  <text x="95" y="214" fill="#9AA7C2" font-size="11">3. 202 Accepted (async — not activated yet)</text>

  <line x1="470" y1="250" x2="655" y2="250" stroke="#F5A623" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <text x="475" y="244" fill="#9AA7C2" font-size="11">4. consume subscription.requested</text>

  <text x="655" y="278" fill="#6B7A99" font-size="10.5" text-anchor="middle">5. allocate MSISDN, save (idempotent on subscriptionId)</text>

  <line x1="655" y1="308" x2="470" y2="308" stroke="#F5A623" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <text x="475" y="302" fill="#9AA7C2" font-size="11">6. publish subscriber.provisioned</text>

  <line x1="470" y1="338" x2="1025" y2="338" stroke="#F5A623" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <text x="700" y="332" fill="#9AA7C2" font-size="11">7. Billing: open billing profile (plan price)</text>

  <line x1="470" y1="368" x2="1210" y2="368" stroke="#F5A623" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <text x="900" y="362" fill="#9AA7C2" font-size="11">8. Notification: send "service activated" SMS</text>

  <text x="845" y="400" fill="#6B7A99" font-size="10.5" text-anchor="middle">— time passes; subscriber makes calls / uses data —</text>

  <line x1="845" y1="428" x2="470" y2="428" stroke="#F5A623" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <text x="500" y="422" fill="#9AA7C2" font-size="11">9. publish usage.recorded (per call/SMS/data event)</text>

  <line x1="470" y1="456" x2="1025" y2="456" stroke="#F5A623" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <text x="700" y="450" fill="#9AA7C2" font-size="11">10. Billing accrues usage charge (row-locked increment)</text>

  <text x="1025" y="484" fill="#6B7A99" font-size="10.5" text-anchor="middle">11. billing cycle: generate invoice (plan + usage)</text>

  <line x1="1025" y1="512" x2="1210" y2="512" stroke="#F5A623" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <text x="1030" y="506" fill="#9AA7C2" font-size="11">12. publish invoice.generated</text>

  <line x1="90" y1="548" x2="1025" y2="548" stroke="#5B8DEF" marker-end="url(#a1)"/>
  <text x="400" y="542" fill="#9AA7C2" font-size="11">13. Customer pays: POST /invoices/{id}/pay  (Idempotency-Key header)</text>

  <text x="655" y="572" fill="#6B7A99" font-size="10.5" text-anchor="middle">14. on repeated failure → payment.failed → Provisioning suspends service</text>
</svg>
